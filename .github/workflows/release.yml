name: Release

# Creates a tag and GitHub release whenever the version in manifest.json
# changes on main. Bump the version, push, done.
on:
  push:
    branches: [main]
    paths:
      - custom_components/skoda_extended/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          v=$(jq -r .version custom_components/skoda_extended/manifest.json)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Skip if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip integration
        if: steps.check.outputs.exists != 'true'
        run: cd custom_components/skoda_extended && zip -r ../../skoda_extended.zip . -x '__pycache__/*'

      - name: Create release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" skoda_extended.zip \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
